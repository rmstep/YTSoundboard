<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Play Sound</title>
<style>
  body { margin: 0; padding: 12px; background: #2d2d2d; color: #d8d8d8; font: 13px "Segoe UI", sans-serif; }
  label { display: block; margin-bottom: 6px; color: #9a9a9a; }
  select { width: 100%; padding: 6px; background: #3d3d3d; color: #fff; border: 1px solid #555; border-radius: 4px; }
  .msg { margin-top: 10px; color: #9a9a9a; font-size: 12px; }
</style>
</head>
<body>
<label for="sound">Sound</label>
<select id="sound"><option value="">Loading…</option></select>
<div class="msg" id="msg"></div>
<script>
let ws, uuid, action, settings = {};
const select = document.getElementById('sound');
const msg = document.getElementById('msg');

function fill(sounds) {
  select.textContent = '';
  select.append(new Option('— choose a sound —', ''));
  for (const s of sounds) select.append(new Option(s.key ? `${s.name}  [${s.key}]` : s.name, s.id));
  select.value = sounds.some((s) => s.id === settings.soundId) ? settings.soundId : '';
  msg.textContent = sounds.length ? '' : 'No sounds found. Is YTSoundboard running?';
}

// Stream Deck calls this global to start the property inspector.
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  const ai = JSON.parse(actionInfo);
  action = ai.action;
  settings = ai.payload.settings || {};
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => {
    ws.send(JSON.stringify({ event: registerEvent, uuid }));
    ws.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload: { request: 'sounds' } }));
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.event === 'sendToPropertyInspector') fill(m.payload.sounds || []);
    if (m.event === 'didReceiveSettings') settings = m.payload.settings || {};
  };
}

select.addEventListener('change', () => {
  settings.soundId = select.value;
  ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
});
</script>
</body>
</html>
